[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coverly"
version = "1.0.1"
description = "A portable, local-first Tamil vinyl artwork archive"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3",
  "httpx>=0.28,<0.29", "beautifulsoup4>=4.12,<5", "Pillow>=11,<14",
  "numpy>=2,<3", "python-multipart>=0.0.20", "pytesseract>=0.3.13,<1",
  "indic-transliteration>=2.3,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
browser = ["playwright>=1.50,<2"]
ai = ["torch>=2.6,<3", "torchvision>=0.21,<1", "spandrel>=0.4,<0.5"]
vision = ["opencv-python-headless>=4.10,<5"]
desktop = ["pywebview>=6,<7"]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
coverly = "coverly.__main__:main"
coverly-desktop = "coverly.desktop:main"

[tool.setuptools.packages.find]
include = ["coverly*"]

[tool.setuptools.package-data]
coverly = ["static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
